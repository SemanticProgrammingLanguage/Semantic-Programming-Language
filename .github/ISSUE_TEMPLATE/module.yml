name: Add or update a Semantic module
description: Publish a module in the Semantic Module Registry
title: "[Module]: "
body:
  - type: markdown
    attributes:
      value: |
        ## Publish a Semantic module
        The archive must be a public HTTPS ZIP containing exactly one `.smod` manifest.

        Optional metadata displayed by the Semantic website:
        - `README.md` or `README.txt`
        - `LICENSE.md` or `LICENSE.txt`
        - an `.ico` icon

  - type: input
    id: module_name
    attributes:
      label: Module name
      description: Enter the module name.
      placeholder: MySemanticModule
    validations:
      required: true

  - type: input
    id: module_url
    attributes:
      label: Module ZIP URL
      description: Enter a direct public HTTPS URL to the ZIP archive.
      placeholder: https://github.com/user/repo/releases/download/v1/MySemanticModule-v1.zip
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I am authorized to publish this module.
          required: true
