name: Import Foreign Package to Semantic Module Store

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Source language / registry"
        required: true
        type: choice
        options:
          - go
          - python
          - rust
          - r
          - node
          - javascript
          - typescript
          - java
          - kotlin
          - csharp
          - dotnet
          - c
          - cpp
          - julia
          - nim
          - swift
      package:
        description: "Package name, module path, Maven coordinate, URL, ZIP, or other source accepted by sp module import"
        required: true
        type: string
      module_name:
        description: "Name shown in the Semantic Module Store"
        required: true
        type: string
      release_version:
        description: "Optional version/tag suffix, e.g. 2.5.3. Leave blank for timestamped build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: semantic-module-import-${{ inputs.module_name }}
  cancel-in-progress: false

env:
  CODE_TRANSPILER_REPO: tarekwasfy01/Code-Transpiler
  MODULE_STORE_REPO: SemanticProgrammingLanguage/Semantic-Module-Store

jobs:
  import-package:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: website
          path: site
          fetch-depth: 0

      - name: Checkout latest Code Transpiler
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_TRANSPILER_REPO }}
          ref: main
          path: code-transpiler
          fetch-depth: 1

      - name: Set up Go from Code Transpiler go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: code-transpiler/go.mod
          cache-dependency-path: code-transpiler/go.sum

      - name: Build Semantic CLI
        working-directory: code-transpiler
        run: |
          set -euo pipefail
          go build -trimpath -o "$GITHUB_WORKSPACE/sp" ./cmd/r2many
          "$GITHUB_WORKSPACE/sp" version || true

      - name: Prepare isolated Semantic module store
        id: store
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/semantic-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/semantic-store-parent"

          "$GITHUB_WORKSPACE/sp" module setpath "$RUNNER_TEMP/semantic-store-parent"

          echo "Semantic module path:"
          "$GITHUB_WORKSPACE/sp" module path
          STORE_PATH="$("$GITHUB_WORKSPACE/sp" module path | tail -n 1 | tr -d '\r')"

          if [ -z "$STORE_PATH" ]; then
            echo "::error::Could not determine Semantic module store path."
            exit 1
          fi

          mkdir -p "$STORE_PATH"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "SEMANTIC_STORE_PATH=$STORE_PATH" >> "$GITHUB_ENV"
          echo "store_path=$STORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Import package into Semantic
        shell: bash
        run: |
          set -euo pipefail
          echo "Importing language=${{ inputs.language }} package=${{ inputs.package }}"
          "$GITHUB_WORKSPACE/sp" module import \
            --language "${{ inputs.language }}" \
            "${{ inputs.package }}"
          echo
          "$GITHUB_WORKSPACE/sp" module list || true

      - name: Build distributable Semantic module ZIP
        id: pack
        env:
          MODULE_NAME: ${{ inputs.module_name }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_LANGUAGE: ${{ inputs.language }}
          SOURCE_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          python source/scripts/package_imported_module.py \
            --store "$SEMANTIC_STORE_PATH" \
            --module-name "$MODULE_NAME" \
            --output-dir "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release/release.env" >> "$GITHUB_ENV"

      - name: Verify central module-store repository access
        env:
          GH_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing repository secret MODULE_STORE_TOKEN."
            echo "::error::Create a fine-grained PAT with Contents: Read and write for $MODULE_STORE_REPO."
            exit 1
          fi
          gh api "repos/$MODULE_STORE_REPO" >/dev/null

      - name: Create GitHub Release in central Semantic Module Store
        env:
          GH_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RELEASE_ZIP#$RELEASE_ASSET_NAME" \
            --repo "$MODULE_STORE_REPO" \
            --title "$MODULE_NAME" \
            --notes-file "$RUNNER_TEMP/release/RELEASE_NOTES.md"

      - name: Update website modules.json
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: |
          set -euo pipefail
          DOWNLOAD_URL="https://github.com/$MODULE_STORE_REPO/releases/download/$RELEASE_TAG/$RELEASE_ASSET_NAME"
          python source/scripts/update_modules_json.py \
            --file site/modules.json \
            --name "$MODULE_NAME" \
            --url "$DOWNLOAD_URL"
          cat site/modules.json

      - name: Commit registry update to website branch
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules.json
          if git diff --cached --quiet; then
            echo "No registry change required."
          else
            git commit -m "Register generated module: ${{ inputs.module_name }}"
            git push origin HEAD:website
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.module_name }}-semantic-module
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ runner.temp }}/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          DOWNLOAD_URL="https://github.com/$MODULE_STORE_REPO/releases/download/$RELEASE_TAG/$RELEASE_ASSET_NAME"
          {
            echo "## Semantic Module published"
            echo
            echo "**Module:** \`${{ inputs.module_name }}\`"
            echo
            echo "**Source language:** \`${{ inputs.language }}\`"
            echo
            echo "**Source package:** \`${{ inputs.package }}\`"
            echo
            echo "**Download:** $DOWNLOAD_URL"
            echo
            echo "Install:"
            echo
            echo '```bash'
            echo "sp module import $DOWNLOAD_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
